[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshotchecker"
version = "0.1.0"
description = "A macOS desktop application for monitoring GUI regions using screenshot comparison."
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "mss",
    "numpy",
    "opencv-python",
    "Pillow",
    "scikit-image",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = [
    "build",
    "dist",
]